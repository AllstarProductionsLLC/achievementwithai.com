name: Share a discovery
description: Propose a useful AI achievement or project for editorial review.
title: '[Discovery] '
body:
  - type: input
    id: source
    attributes:
      label: Original source URL
      placeholder: https://
    validations:
      required: true
  - type: textarea
    id: achievement
    attributes:
      label: What was achieved, and how did AI help?
    validations:
      required: true
  - type: textarea
    id: connection
    attributes:
      label: Your connection, evidence, and limitations
      description: Disclose your relationship to the project and link supporting evidence. Do not include private information.
    validations:
      required: true
