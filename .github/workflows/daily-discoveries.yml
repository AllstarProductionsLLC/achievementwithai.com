name: Refresh daily discoveries
on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: daily-discoveries
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run refresh
      - run: npm test
      - run: npm run build
      - run: npm run check
      - name: Commit the verified edition
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/news.json content/archive.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "content: refresh the daily discovery edition"
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Notify the optional Vercel deploy hook
        env:
          VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: node scripts/deploy-hook.mjs
